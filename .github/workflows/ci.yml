# CI —— 只跑 tests/unit（自包含，不连外部服务）。
#
# 范围刻意不包含 tests/integration / tests/e2e：那两类要连真实
# Postgres/Chroma/OpenSearch/Ollama，而 conftest.py 至今没有对应的
# DB/LLM fixture（CLAUDE.md §4 P1 已记录的已知空白，需要单独的设计
# 评审，不在这次任务范围内）。
#
# 装依赖用 requirements.lock 而不是 pyproject.toml：与 Dockerfile 的
# deps 阶段完全一致的方式（pyproject 里的依赖大多只有 >= 下界，直接
# 装会得到不可复现的版本组合，这正是引入 requirements.lock 的原因，
# 见 Dockerfile 开头注释）。
#
# 前端 job 装依赖用 `npm ci` 而不是 `npm install`：npm ci 严格按
# frontend/package-lock.json 装，lockfile 与 package.json 对不上时**直接失败**，
# 而不是顺手改写 lockfile——这正是这个 job 要守住的东西。用 npm install 的话，
# 有人只改了 package.json、忘了同步提交 lockfile，CI 自己把差异补上然后绿灯
# 放行，而别人的 checkout 装不到那个包，缺陷被推迟到运行时才暴露。
#
# 跑 `npx vite build` 而不是只装依赖：2026-08-27 那次真实故障（运维塔台新增的
# 两个 @fontsource 字体包只进了 package.json）的表现形式是 vite 解析不到依赖、
# 页面白屏，而装依赖这一步本身是不报错的。只有真的构建一次，"依赖装齐了"才
# 等于"页面出得来"。构建同时覆盖 vite.config.js 里 index.html 与 ops.html
# 两个入口，塔台那一页不会因为没人访问就漏出门禁之外。
#
# 没有加前端单元测试步骤：frontend/ 下至今没有任何测试文件，也没有配置测试
# 运行器（package.json 的 scripts 只有 dev/build/preview）。接一个空跑的测试
# 步骤只会给出"前端有测试保障"的错觉，故这条流水线对前端只做构建门禁。
#
# Node 固定 20：vite 5 声明的 engines 是 ^18.0.0 || >=20.0.0，20 是其中仍在
# 维护的最低档。按最低支持版本跑，能顺带抓到"本机 Node 比 CI 新、代码用了
# 新版本才有的 API"这类只在别人机器上炸的问题。
#
# 没有加 ruff/mypy 检查 job：两者在 pyproject.toml 里都已配置，但
# 核实过并非"配置好了只是没接自动化"——ruff 现状对全仓 check 有
# 10000+ 处违规（配置存在但从未真正执行过），mypy 在当前环境下
# 因 numpy 类型桩与 [tool.mypy] 里 python_version=3.10 的组合直接
# 报语法错误、完全跑不起来。把它们接成 CI 门禁会让这条流水线一
# 上线就对所有人和所有 PR 报红，这是需要先做代码/配置清理的独立
# 决策，不该在补 CI 这个任务里顺带拍板，故未接入。

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.lock

      - name: Run unit tests
        run: python -m pytest tests/unit -q

  frontend:
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npx vite build
