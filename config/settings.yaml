# Modular RAG MCP Server - Configuration
# This is the main configuration file for the MCP Server.
# Edit this file to configure LLM, Embedding, VectorStore, and other services.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "ollama"
  model: "qwen2.5:7b"
  base_url: "http://localhost:11434"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "ollama"
  model: "nomic-embed-text"
  base_url: "http://localhost:11434"
  dimensions: 768

# =============================================================================
# Vision LLM Configuration (for Image Captioning)
# =============================================================================
vision_llm:
  enabled: true
  provider: "openai"  # no OllamaVisionLLM exists; reuse OpenAIVisionLLM against Ollama's OpenAI-compatible endpoint
  model: "qwen2.5vl:7b"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"  # unchecked by Ollama, but OpenAIVisionLLM requires a non-empty value
  max_image_size: 2048  # Max dimension (width/height) for image compression

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: true
  provider: "cross_encoder"  # Options: none, cross_encoder, dashscope, llm
  model: "BAAI/bge-reranker-base"  # local, no API key, supports zh/en
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: true
  provider: "ragas"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  max_workers: 3  # Transform 阶段 LLM 调用的最大并发数
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: false  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement

  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: false  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment

  # Document Summary Configuration — 层次化检索索引的文档摘要层
  # (src/ingestion/hierarchy/doc_summary.py)
  doc_summary:
    use_llm: false  # Set to true to enable LLM-based summarization (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based summary
    top_docs: 5  # 摘要层召回的候选文档数上限，见 query_knowledge_hub.py _narrow_by_document_summary

# =============================================================================
# MCP Client Configuration (External Tool Servers)
# =============================================================================
mcp_servers:
  # 简易 MCP Server（纯 Python 内置工具）
  simple:
    transport: stdio
    command: "python"
    args: ["scripts/simple_mcp_server.py", "--stdio"]
    timeout_seconds: 30

  # Example: Tavily Web Search MCP Server
  # tavily:
  #   transport: sse
  #   url: "http://localhost:3000/sse"
  #   timeout_seconds: 30
  
  # Example: Filesystem MCP Server
