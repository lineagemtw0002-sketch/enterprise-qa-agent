services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eqa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: eqa
      POSTGRES_PASSWORD: eqa
      POSTGRES_DB: eqa
    ports:
      - "5432:5432"
    volumes:
      - eqa-postgres-data:/var/lib/postgresql/data
      - ./backend/db/initdb:/docker-entrypoint-initdb.d

volumes:
  eqa-postgres-data:
