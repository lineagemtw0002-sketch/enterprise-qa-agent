# 本地开发 / 单机部署编排。
#
# 不在这里的东西，以及为什么：
# - **Ollama**：模型服务跑在宿主机。容器里跑 Ollama 拿不到 Apple Silicon 的
#   GPU（Metal），会退化成 CPU 推理，慢一个数量级。后端通过
#   host.docker.internal 访问宿主机的 11434。
# - **前端**：Vite 开发服务器本地跑（`cd frontend && npm run dev`）；
#   生产应该是构建成静态文件交给 CDN 或 nginx，不该跟后端同容器。
#
# 起停：
#   docker compose up -d          # 起 postgres + opensearch
#   docker compose --profile app up -d   # 连后端一起起
#   docker compose down           # 停，保留数据卷
#   docker compose down -v        # 停并删数据 ⚠️ 不可逆

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ragent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragent_dev_only}
      POSTGRES_DB: ragent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragent -d ragent"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      - discovery.type=single-node
      # ⚠️ -Xms 必须等于 -Xmx。不相等会让 JVM 反复调整堆，低内存下更糟。
      # 512m 是本机实测值：空容器 831MiB，灌 10000 块后 862MiB（只涨 18MB）。
      # **这个值只对本机测试数据成立**——目标规模（143K 块 × 6 库 × 3 客户）
      # 需要重新规划，生产堆通常给可用内存的一半。别照抄。
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      # ⚠️⚠️ 仅本地开发。security plugin 提供 RBAC / 字段级安全 / 审计日志，
      # 而这三样正是本项目选 OpenSearch 而不是 Elasticsearch 的理由
      # （ES 把它们放在 Platinum 付费层）。**生产必须开**。
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
    ports:
      - "9200:9200"
    volumes:
      - osdata:/usr/share/opensearch/data
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          # 容器层兜底，防止 JVM 之外的部分慢慢吃满。
          # 堆 512m + 非堆约 320m ≈ 850m，留 150m 余量。
          memory: 1g

  backend:
    # 默认不启动——本地开发通常直接跑 .venv 里的进程，改代码不用重建镜像。
    # 要连后端一起起：docker compose --profile app up -d
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    environment:
      RAGENT_POSTGRES_URL: postgresql://ragent:${POSTGRES_PASSWORD:-ragent_dev_only}@postgres:5432/ragent
      # 模型服务在宿主机，见文件头说明
      RAGENT_LLM_BASE_URL: http://host.docker.internal:11434/v1
      RAGENT_EMBEDDING_BASE_URL: http://host.docker.internal:11434/v1
      RAGENT_OPENSEARCH_URL: http://opensearch:9200
      # ⚠️ 必须由外部提供（`.env` 或 shell 环境）。
      # 生成：python -c "import secrets; print(secrets.token_urlsafe(48))"
      #
      # 刻意**不用** `${...:?错误信息}` 形式做守卫：compose 在解析整个文件时
      # 就会求值，哪怕 backend 在 profile 后面根本没启动，也会让
      # `docker compose up -d`（只起 postgres/opensearch）整个失败。
      # 这道守卫本来就在更合适的层：`auth.py::resolve_jwt_secret` 在密钥
      # 缺失或等于源码内置默认值时拒绝启动，且报错里带生成命令
      # （2026-08-24 的 P0 修复）。不要在这里重复。
      RAGENT_JWT_SECRET: ${RAGENT_JWT_SECRET:-}
      RAGENT_DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      # 2.7GB 的索引与上传文件，挂卷不进镜像
      - ./data:/app/data
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  pgdata:
  osdata:
